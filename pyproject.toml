[project]
name = "autoflix-cli"
version = "1.0.0"
description = "Watch movies, series, and anime in multiple languages (FR, EN, and more) directly from your terminal."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
license-files = ["LICENSE"]
authors = [{name = "PaulExplorer"}]
keywords = ["autoflix", "anime", "movies", "series", "VF", "VOSTFR", "anime-sama", "coflix"]

# Dependencies
dependencies = [
    "beautifulsoup4>=4.14.3",
    "curl-cffi>=0.15.0",
    "flask>=3.1.2",
    "html5lib>=1.1",
    "jsbeautifier>=1.15.4",
    "readchar>=4.2.1",
    "rich>=14.2.0",
    "platformdirs>=4.0.0",
    "pycryptodome>=3.23.0",
    "m3u8>=6.0.0",
]

# Project URLs
[project.urls]
Homepage = "https://github.com/PaulExplorer/autoflix-cli"
Repository = "https://github.com/PaulExplorer/autoflix-cli.git"

[project.scripts]
autoflix = "autoflix_cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Lint convention: what ruff flags on this codebase.
# "On" are bug classes (the pyflakes F checks find real dead code / missing
# names, B catches closure and mutable-default traps, E722 catches bare
# except). Everything else in ruff's default set is opinionated style that
# the existing codebase deliberately uses (blind excepts, except-pass,
# implicit Optionals...): those checks are ignored so `ruff check` stays a
# zero-noise contract — CI/IDE silence equals "no bug-class findings".
[tool.ruff.lint]
select = [
    "F",     # pyflakes: unused names, undefined names, shadowed bindings
    "B",     # bugbear: late-binding closures, mutable defaults, chained raises
    "E722",  # bare except
    "I",     # import sorting
    "RUF022",# sorted __all__
    "W",     # whitespace correctness
]
ignore = [
    "F403", "F405",  # from tests/support import * style
    "B008",          # read-only default args here
    "BLE001",        # broad `except Exception` is the repo-wide convention
    "S110",          # try-except-pass on scraper probes is intended
    "S112",          # try-except-continue on scraper loops is intended
    "PLW0602",       # `global` reads in the proxy are deliberate
    "TRY004",        # TypeError preference is not the house style
    "C901",          # large functions stay for now
]

[tool.ruff.lint.isort]
known-first-party = ["autoflix_cli"]
